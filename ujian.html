<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ujian Siswa - CBT SMKN 1 Klaten</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; margin: 0; user-select: none; -webkit-user-select: none; }
    .hidden { display: none !important; }
    .loader { border: 4px solid #f3f4f6; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    /* Custom Scrollbar for Grid */
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col" oncontextmenu="return false;">

  <!-- LOADING OVERLAY -->
  <div id="loading-overlay" class="hidden fixed inset-0 z-50 bg-white/90 backdrop-blur-sm flex flex-col items-center justify-center">
    <div class="loader mb-3"></div><div class="text-sm font-bold text-slate-700" id="loading-text">Memproses Data...</div>
  </div>

  <!-- VIEW 1: LOBBY (INPUT TOKEN) -->
  <div id="view-lobby" class="flex-1 flex items-center justify-center p-5 bg-gradient-to-br from-slate-50 to-slate-100">
    <div class="bg-white rounded-[2rem] shadow-2xl shadow-slate-200/50 w-full max-w-sm p-8 space-y-6 text-center border border-slate-100 relative overflow-hidden">
      
      <!-- Hiasan Background -->
      <div class="absolute -top-16 -right-16 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl"></div>
      
      <!-- Header Lobby -->
      <div class="relative z-10">
        <div class="w-16 h-16 bg-gradient-to-br from-blue-50 to-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mx-auto shadow-inner border border-blue-100 mb-4">
          <i data-lucide="fingerprint" class="w-8 h-8"></i>
        </div>
        <h2 class="text-2xl font-extrabold text-slate-800 tracking-tight" id="lobby-nama">Nama Siswa</h2>
        <div class="flex items-center justify-center gap-2 mt-2">
          <span class="text-xs font-bold text-slate-500 bg-slate-100 px-3 py-1 rounded-full uppercase tracking-wider" id="lobby-kelas">Kelas</span>
          <span class="text-xs font-bold text-blue-500 bg-blue-50 px-3 py-1 rounded-full uppercase tracking-wider" id="lobby-username">NIS</span>
        </div>
      </div>
      
      <!-- Box Peringatan -->
      <div class="bg-red-50 border border-red-100 p-4 rounded-2xl text-left text-xs text-red-800 space-y-1.5 shadow-sm relative z-10">
        <strong class="block mb-2 text-sm flex items-center gap-1.5 text-red-600"><i data-lucide="shield-alert" class="w-4 h-4"></i> Proteksi Anti-Cheat</strong>
        <p class="flex items-start gap-1.5"><i data-lucide="check-circle-2" class="w-4 h-4 shrink-0 text-red-400"></i> Sistem mengunci layar secara penuh.</p>
        <p class="flex items-start gap-1.5"><i data-lucide="check-circle-2" class="w-4 h-4 shrink-0 text-red-400"></i> Dilarang berpindah aplikasi (WA, Google).</p>
      </div>
      
      <!-- Input & Tombol -->
      <div class="pt-2 relative z-10">
        <input id="input-token" type="text" placeholder="KETIK TOKEN UJIAN" class="w-full px-4 py-4 text-center text-xl font-mono font-black uppercase tracking-[0.3em] border-2 border-slate-200 rounded-2xl focus:border-blue-600 focus:bg-blue-50/30 outline-none transition-all placeholder:font-sans placeholder:font-semibold placeholder:tracking-normal placeholder:text-sm">
      </div>
      <button onclick="mulaiUjian()" class="w-full bg-slate-900 hover:bg-slate-800 active:scale-95 text-white font-bold py-4 rounded-2xl transition-all shadow-lg shadow-slate-900/20 flex items-center justify-center gap-2 relative z-10">
        Mulai Kerjakan <i data-lucide="play-circle" class="w-5 h-5"></i>
      </button>
      
      <div class="pt-2 border-t border-slate-100">
        <button onclick="keluarSistem()" class="text-xs font-bold text-slate-400 hover:text-red-500 transition-colors">Bukan Anda? Ganti Akun</button>
      </div>
    </div>
  </div>

  <!-- VIEW 2: RUANG UJIAN UTAMA -->
  <div id="view-ujian" class="hidden flex-1 flex flex-col h-screen overflow-hidden bg-[#f1f5f9]">
    
    <!-- HEADER MODERN (MENEMPEL) -->
    <header class="bg-white px-4 py-3 flex justify-between items-center shrink-0 border-b border-slate-200 shadow-sm z-30">
      
      <!-- Info Kiri: Identitas & Mapel -->
      <div class="flex items-center gap-3 w-1/2">
        <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl flex items-center justify-center text-white shrink-0 shadow-md shadow-blue-500/20 relative">
          <i data-lucide="user" class="w-5 h-5"></i>
          <div class="absolute -bottom-1 -right-1 w-3 h-3 bg-emerald-400 border-2 border-white rounded-full"></div>
        </div>
        <div class="flex flex-col min-w-0">
          <span class="font-bold text-[13px] text-slate-800 truncate" id="header-nama">Nama Siswa</span>
          <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wide truncate" id="header-mapel">Mata Pelajaran</span>
        </div>
      </div>
      
      <!-- Info Kanan: Timer & Pelanggaran -->
      <div class="flex items-center gap-2 shrink-0">
        <div class="bg-red-50 px-2.5 py-1.5 rounded-lg text-[10px] font-bold text-red-600 border border-red-100 flex items-center gap-1 shadow-sm">
          <i data-lucide="alert-triangle" class="w-3 h-3"></i> <span id="ui-pelanggaran">0/3</span>
        </div>
        <div class="bg-slate-900 px-3 py-1.5 rounded-lg font-mono font-bold text-emerald-400 text-sm flex items-center gap-1.5 shadow-md">
          <i data-lucide="clock" class="w-3.5 h-3.5 text-slate-400"></i> <span id="ui-waktu">00:00</span>
        </div>
      </div>
    </header>

    <!-- AREA SOAL (BISA DI-SCROLL) -->
    <main class="flex-1 overflow-y-auto p-4 pb-32 relative">
      <div class="bg-white rounded-[1.5rem] p-6 shadow-sm border border-slate-200 max-w-2xl mx-auto min-h-[60vh] flex flex-col relative overflow-hidden">
        
        <!-- Label Status & Buka Grid -->
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
          <div class="flex gap-2">
            <span class="bg-blue-100/50 border border-blue-200 text-blue-700 font-bold px-3.5 py-1.5 rounded-xl text-xs tracking-wide shadow-sm flex items-center gap-1.5" id="ui-nosoal">
              SOAL 1
            </span>
            <span id="ui-status-ragu" class="hidden bg-amber-100/50 border border-amber-200 text-amber-700 font-bold px-3 py-1.5 rounded-xl text-xs tracking-wide shadow-sm flex items-center gap-1">
               <i data-lucide="help-circle" class="w-3.5 h-3.5"></i> Ragu
            </span>
          </div>
          
          <button onclick="bukaGrid()" class="text-xs font-bold text-slate-600 bg-slate-50 border border-slate-200 px-3.5 py-1.5 rounded-xl flex items-center gap-1.5 active:bg-slate-200 transition-colors shadow-sm">
            <i data-lucide="layout-grid" class="w-4 h-4"></i> Daftar Soal
          </button>
        </div>
        
        <!-- Konten Pertanyaan -->
        <div id="ui-pertanyaan" class="text-slate-800 text-[15px] sm:text-base leading-relaxed font-medium mb-8"></div>
        
        <!-- Opsi Jawaban -->
        <div id="ui-opsi" class="space-y-3 mt-auto"></div>
      </div>
    </main>

    <!-- FLOATING ACTION BAR (BOTTOM NAV) -->
    <div class="absolute bottom-0 left-0 w-full bg-white/90 backdrop-blur-md border-t border-slate-200 p-4 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] z-20">
      <div class="flex justify-between items-center gap-3 max-w-2xl mx-auto">
        
        <!-- Tombol Kiri (Kembali) -->
        <button onclick="navSoal(-1)" id="btn-prev" class="flex-1 py-4 bg-slate-100 rounded-[1.2rem] text-sm font-bold text-slate-600 active:bg-slate-200 flex items-center justify-center gap-1 transition-all">
          <i data-lucide="chevron-left" class="w-5 h-5"></i> <span class="hidden sm:inline">Kembali</span>
        </button>
        
        <!-- Tombol Tengah (Ragu-Ragu) -->
        <button onclick="toggleRagu()" id="btn-ragu" class="flex-1 py-4 bg-amber-100 text-amber-700 border border-amber-200 rounded-[1.2rem] text-sm font-bold active:bg-amber-200 flex items-center justify-center gap-1.5 transition-all">
          <div id="icon-ragu-uncheck"><i data-lucide="square" class="w-4 h-4"></i></div>
          <div id="icon-ragu-check" class="hidden"><i data-lucide="check-square" class="w-4 h-4"></i></div>
          Ragu-Ragu
        </button>
        
        <!-- Tombol Kanan (Lanjut / Kumpulkan) -->
        <button onclick="navSoal(1)" id="btn-next" class="flex-1 py-4 bg-blue-600 rounded-[1.2rem] text-sm font-bold text-white active:bg-blue-700 active:scale-[0.98] flex items-center justify-center gap-1 transition-all shadow-lg shadow-blue-600/30">
          <span class="hidden sm:inline">Lanjut</span> <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </button>
        <button onclick="kumpulUjian(false)" id="btn-finish" class="hidden flex-1 py-4 bg-emerald-500 rounded-[1.2rem] text-sm font-bold text-white active:bg-emerald-600 active:scale-[0.98] flex items-center justify-center gap-1.5 transition-all shadow-lg shadow-emerald-500/30">
          Kumpulkan <i data-lucide="check-circle" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL BOTTOM SHEET: GRID SOAL -->
  <div id="modal-grid" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex flex-col justify-end transition-opacity">
    <div class="bg-white w-full max-w-2xl mx-auto rounded-t-3xl p-6 pb-10 transform transition-transform shadow-2xl flex flex-col max-h-[80vh]">
      
      <!-- Modal Header -->
      <div class="flex justify-between items-center mb-5 shrink-0">
        <div>
          <h3 class="font-extrabold text-lg text-slate-800 tracking-tight">Navigasi Pengerjaan</h3>
          <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-wider" id="grid-status-text">Terjawab: 0 / 0</p>
        </div>
        <button onclick="tutupGrid()" class="bg-slate-100 p-2.5 rounded-full active:bg-slate-200 text-slate-500 transition-colors"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      
      <!-- Legenda Warna -->
      <div class="flex gap-4 mb-5 text-[10px] font-bold text-slate-500 uppercase tracking-wide shrink-0 bg-slate-50 p-3 rounded-xl border border-slate-100">
        <div class="flex items-center gap-1.5"><div class="w-3 h-3 bg-white border-2 border-slate-200 rounded-md"></div> Kosong</div>
        <div class="flex items-center gap-1.5"><div class="w-3 h-3 bg-blue-500 rounded-md"></div> Terjawab</div>
        <div class="flex items-center gap-1.5"><div class="w-3 h-3 bg-amber-400 rounded-md"></div> Ragu-Ragu</div>
      </div>
      
      <!-- Scrollable Grid -->
      <div class="overflow-y-auto custom-scroll p-1 flex-1">
        <div id="ui-grid" class="grid grid-cols-5 sm:grid-cols-7 gap-3">
          <!-- Tombol grid di-render JS -->
        </div>
      </div>
      
    </div>
  </div>

  <script>
    // URL API WAJIB DIGANTI JIKA BERBEDA
    const API_URL = "https://script.google.com/macros/s/AKfycbzFTfvZyEwK9kGtE14VeYgqXn2t6q6V5rput0NvIKryO5CqYCCS4PyEKcCM5qo9E-A/exec";
    
    // VARIABEL STATE LOKAL
    let user = null;
    let sesi = null;
    let soalList = [];
    let curIdx = 0;
    
    // Brankas State Lokal (Tersimpan di LocalStorage)
    let jawaban = {}; 
    let listRagu = {}; 
    
    let sisaDetik = 0;
    let timer = null;
    let pelanggaran = 0;
    let isUjian = false;
    let lastBlur = 0;

    lucide.createIcons();

    // --- MANAJEMEN UI SEDERHANA ---
    function showLoading(text = "Memproses Data...") { 
      document.getElementById('loading-text').innerText = text;
      document.getElementById('loading-overlay').classList.remove('hidden'); 
    }
    function hideLoading() { document.getElementById('loading-overlay').classList.add('hidden'); }

    // --- INIT & SESSION CEK ---
    // Cek apakah siswa nge-refresh halaman tapi masih ada sesi yang nyangkut di LocalStorage
    window.addEventListener('DOMContentLoaded', () => {
      const savedSesi = localStorage.getItem('cbt_sesi');
      if (savedSesi) {
        try {
          const data = JSON.parse(savedSesi);
          user = data.user;
          sesi = data.sesi;
          soalList = data.soalList;
          jawaban = data.jawaban || {};
          listRagu = data.listRagu || {};
          curIdx = data.curIdx || 0;
          
          const waktuBerjalan = Math.floor((Date.now() - data.lastSaveTime) / 1000);
          sisaDetik = data.sisaDetik - waktuBerjalan;
          pelanggaran = data.pelanggaran || 0;

          if (sisaDetik > 0) {
            setupUIUjian();
          } else {
            kumpulUjian(true); // Waktu habis saat offline
          }
        } catch (e) {
          localStorage.removeItem('cbt_sesi');
          cekOtentikasiAwal();
        }
      } else {
        cekOtentikasiAwal();
      }
    });

    function cekOtentikasiAwal() {
      // Karena ini sistem 1 file mandiri (ujian.html), kita minta login ulang jika belum ada data.
      // Jika Anda mengandalkan index.html untuk login, ganti ini dengan redirect ke index.html
      const loggedUser = sessionStorage.getItem('cbt_user');
      if (loggedUser) {
        user = JSON.parse(loggedUser);
        tampilkanLobby();
      } else {
        // Asumsi standar: login terjadi di index.html. Arahkan ke sana.
        // Jika Anda ingin form loginnya ada di file ini, abaikan window.location dan panggil formnya.
        window.location.href = "index.html"; 
      }
    }

    // Dipanggil saat login dari index.html berhasil dan berpindah ke sini
    function tampilkanLobby() {
      document.getElementById('lobby-nama').innerText = user.nama;
      document.getElementById('lobby-kelas').innerText = user.kelas;
      document.getElementById('lobby-username').innerText = user.username;
      
      document.getElementById('view-lobby').classList.remove('hidden');
      document.getElementById('view-ujian').classList.add('hidden');
    }

    function keluarSistem() {
      sessionStorage.removeItem('cbt_user');
      window.location.href = "index.html";
    }

    // --- KONEKSI API ---
    function callAPI(action, payload, callback) {
      showLoading();
      let finalPayload = { ...payload };
      if (user && user.username) finalPayload.u = user.username;
      
      fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, payload: finalPayload }) })
      .then(r => r.json())
      .then(res => { hideLoading(); callback(res); })
      .catch(() => { hideLoading(); Swal.fire('Error', 'Gagal koneksi ke server pusat. Periksa koneksi internet.', 'error'); });
    }

    // --- ALUR MULAI UJIAN ---
    function mulaiUjian() {
      const token = document.getElementById('input-token').value.trim();
      if (!token) return Swal.fire('Perhatian', 'Ketik Token Ujian yang diberikan pengawas!', 'warning');
      
      callAPI('mulaiUjian', { token: token }, res => {
        if (!res.success) return Swal.fire('Akses Ditolak', res.msg, 'error');
        
        sesi = res.sesi; 
        soalList = res.soal; 
        curIdx = 0; 
        jawaban = {}; 
        listRagu = {};
        pelanggaran = sesi.pelanggaran; 
        sisaDetik = sesi.durasi * 60;
        
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(()=>{});
        }
        
        setupUIUjian();
      });
    }

    function setupUIUjian() {
      document.getElementById('view-lobby').classList.add('hidden');
      document.getElementById('view-ujian').classList.remove('hidden');
      
      document.getElementById('header-nama').innerText = user.nama;
      document.getElementById('header-mapel').innerText = sesi.mapel;
      
      saveToLocal();
      renderSoal(); 
      mulaiTimer(); 
      pasangAntiCheat();
    }

    // --- LOCAL STORAGE MANAGER (BRANKAS OFFLINE) ---
    function saveToLocal() {
      if(!isUjian) return;
      const data = {
        user, sesi, soalList, jawaban, listRagu, curIdx, sisaDetik, pelanggaran, lastSaveTime: Date.now()
      };
      localStorage.setItem('cbt_sesi', JSON.stringify(data));
    }

    // --- RENDER UI SOAL ---
    function renderSoal() {
      const s = soalList[curIdx];
      
      document.getElementById('ui-nosoal').innerHTML = `SOAL ${curIdx + 1} <span class="text-blue-400/50 px-1">|</span> ${soalList.length}`;
      
      let htmlTanya = `<div class="mb-4">${s.tanya}</div>`;
      if (s.gbrSoal) {
        s.gbrSoal.split(',').forEach(url => { 
          htmlTanya += `<img src="${url.trim()}" class="w-full sm:max-w-md rounded-2xl border-2 border-slate-100 shadow-sm mb-4 object-cover">`; 
        });
      }
      document.getElementById('ui-pertanyaan').innerHTML = htmlTanya;
      
      document.getElementById('ui-opsi').innerHTML = ['A','B','C','D','E'].map(opt => {
        if (!s['opsi'+opt] && !s['gbr'+opt]) return ''; 
        const isSel = jawaban[s.id] === opt; 
        
        let htmlOpsi = s['opsi'+opt] ? `<div class="text-[14px] sm:text-[15px] pt-1">${s['opsi'+opt]}</div>` : '';
        if (s['gbr'+opt]) { 
          htmlOpsi += `<img src="${s['gbr'+opt].split(',')[0].trim()}" class="w-full max-w-[200px] rounded-xl border-2 border-slate-100 mt-3 shadow-sm">`; 
        }
        
        const styleBox = isSel 
          ? 'border-blue-500 bg-blue-50/70 shadow-[0_0_0_4px_rgba(59,130,246,0.15)] ring-1 ring-blue-500/50' 
          : 'border-slate-200 bg-white hover:border-slate-300';
          
        const styleBulat = isSel ? 'bg-blue-600 text-white shadow-md shadow-blue-500/40' : 'bg-slate-100 text-slate-500 border border-slate-200';

        return `<div onclick="pilihOpsi('${s.id}', '${opt}')" class="p-4 rounded-2xl border-2 cursor-pointer transition-all duration-200 flex items-start gap-4 active:scale-[0.98] ${styleBox}">
                  <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0 text-sm font-black transition-all ${styleBulat}">${opt}</div>
                  <div class="flex-1 text-slate-700 font-semibold">${htmlOpsi}</div>
                </div>`;
      }).join('');

      updateLabelRagu(s.id);
      document.getElementById('ui-pelanggaran').innerText = `${pelanggaran}/3`;
      
      document.getElementById('btn-prev').disabled = curIdx === 0;
      document.getElementById('btn-prev').classList.toggle('opacity-40', curIdx === 0);
      
      const isLast = (curIdx === soalList.length - 1);
      document.getElementById('btn-next').classList.toggle('hidden', isLast);
      document.getElementById('btn-finish').classList.toggle('hidden', !isLast);
    }

    // --- INTERAKSI SOAL ---
    function pilihOpsi(id, opt) { 
      jawaban[id] = opt; 
      saveToLocal(); 
      renderSoal(); 
    }
    
    function toggleRagu() {
      const id = soalList[curIdx].id;
      if (listRagu[id]) { delete listRagu[id]; } else { listRagu[id] = true; }
      saveToLocal();
      updateLabelRagu(id);
    }
    
    function updateLabelRagu(id) {
      const btnRagu = document.getElementById('btn-ragu');
      const boxStatus = document.getElementById('ui-status-ragu');
      
      if (listRagu[id]) {
        btnRagu.classList.replace('bg-amber-100', 'bg-amber-500');
        btnRagu.classList.replace('text-amber-700', 'text-white');
        document.getElementById('icon-ragu-uncheck').classList.add('hidden');
        document.getElementById('icon-ragu-check').classList.remove('hidden');
        boxStatus.classList.remove('hidden');
      } else {
        btnRagu.classList.replace('bg-amber-500', 'bg-amber-100');
        btnRagu.classList.replace('text-white', 'text-amber-700');
        document.getElementById('icon-ragu-check').classList.add('hidden');
        document.getElementById('icon-ragu-uncheck').classList.remove('hidden');
        boxStatus.classList.add('hidden');
      }
    }

    function navSoal(step) { 
      if(soalList[curIdx + step]) { 
        curIdx += step; 
        saveToLocal();
        renderSoal(); 
        document.querySelector('main').scrollTo({ top: 0, behavior: 'smooth' }); 
      } 
    }

    // --- MODAL GRID NAVIGASI ---
    function bukaGrid() {
      document.getElementById('modal-grid').classList.remove('hidden');
      let terjawab = 0;
      
      document.getElementById('ui-grid').innerHTML = soalList.map((s, i) => {
        const id = s.id;
        const isJawab = !!jawaban[id];
        const isRagu = !!listRagu[id];
        
        if (isJawab) terjawab++;
        
        let styleBtn = 'bg-white text-slate-500 border-2 border-slate-200'; // Kosong
        
        if (isJawab && !isRagu) {
            styleBtn = 'bg-blue-500 text-white border-2 border-blue-500 shadow-md shadow-blue-500/30'; // Mantap
        } else if (isRagu) {
            styleBtn = 'bg-amber-400 text-white border-2 border-amber-400 shadow-md shadow-amber-400/30'; // Ragu
        }

        if (i === curIdx) styleBtn = 'ring-4 ring-offset-2 ring-slate-800 ' + styleBtn;

        return `<button onclick="tutupGrid(); curIdx=${i}; renderSoal();" class="aspect-square rounded-2xl font-black text-sm transition-all active:scale-90 ${styleBtn}">${i+1}</button>`;
      }).join('');
      
      document.getElementById('grid-status-text').innerText = `TERJAWAB: ${terjawab} DARI ${soalList.length}`;
    }
    
    function tutupGrid() { document.getElementById('modal-grid').classList.add('hidden'); }

    // --- TIMER & PENGIRIMAN ---
    function mulaiTimer() {
      isUjian = true;
      timer = setInterval(() => {
        sisaDetik--;
        
        if(sisaDetik === 300) { document.getElementById('ui-waktu').classList.replace('text-emerald-400', 'text-red-500'); document.getElementById('ui-waktu').classList.add('animate-pulse'); }
        document.getElementById('ui-waktu').innerText = `${Math.floor(sisaDetik / 60).toString().padStart(2,'0')}:${(sisaDetik % 60).toString().padStart(2,'0')}`;
        
        if (sisaDetik % 10 === 0) saveToLocal(); 
        
        if(sisaDetik <= 0) { 
            clearInterval(timer); 
            kumpulUjian(true); 
        }
      }, 1000);
    }

    function kumpulUjian(otomatis) {
      if (!otomatis) {
          const totalJawab = Object.keys(jawaban).length;
          const sisaKosong = soalList.length - totalJawab;
          let msg = sisaKosong > 0 ? `<br><b class='text-red-500'>Perhatian: Masih ada ${sisaKosong} soal kosong!</b>` : '';
          
          Swal.fire({
              title: 'Akhiri Ujian?',
              html: `Pastikan semua soal telah dicek kembali.${msg}`,
              icon: 'question',
              showCancelButton: true,
              confirmButtonColor: '#3b82f6',
              cancelButtonColor: '#94a3b8',
              confirmButtonText: 'Ya, Kumpulkan',
              cancelButtonText: 'Batal'
          }).then((res) => {
              if (res.isConfirmed) eksekusiSubmit();
          });
      } else {
          eksekusiSubmit();
      }
    }
    
    function eksekusiSubmit() {
        isUjian = false; // Matikan sensor anti-cheat agar keluar fullscreen aman
        clearInterval(timer); 
        window.onbeforeunload = null;
        
        if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
        
        showLoading("Mengirim Jawaban ke Server...");
        
        fetch(API_URL, { 
            method: 'POST', 
            body: JSON.stringify({ action: 'kumpulUjian', payload: { u: user.username, sesiId: sesi.id, jawaban: jawaban } }) 
        })
        .then(r => r.json())
        .then(res => {
            hideLoading();
            if (res.success) {
                localStorage.removeItem('cbt_sesi');
                Swal.fire({ 
                    icon: 'success', title: 'UJIAN SELESAI', 
                    html: `Jawaban berhasil direkam.<br><b>NILAI ANDA: <span class="text-3xl text-emerald-600 ml-2">${res.skor}</span></b>`, 
                    allowOutsideClick: false, confirmButtonText: 'Kembali ke Beranda', confirmButtonColor: '#10b981'
                }).then(() => { window.location.href = 'index.html'; });
            } else {
                Swal.fire({ icon: 'error', title: 'Gagal Terkirim', text: res.msg + ' (Coba lagi tanpa menutup browser)', confirmButtonText: 'Coba Kirim Ulang', allowOutsideClick: false })
                .then(() => { eksekusiSubmit(); });
            }
        }).catch(() => {
            hideLoading();
            Swal.fire({ icon: 'warning', title: 'Koneksi Terputus', text: 'Internet terputus. Jangan tutup browser, tekan coba lagi saat internet menyala.', confirmButtonText: 'Coba Kirim', allowOutsideClick: false })
            .then(() => { eksekusiSubmit(); });
        });
    }

    // --- SENSOR ANTI-CHEAT ---
    function pasangAntiCheat() {
      document.addEventListener('visibilitychange', () => { if (isUjian && document.hidden) catatPelanggaran('Keluar dari halaman aplikasi'); });
      document.addEventListener('fullscreenchange', () => { if (isUjian && !document.fullscreenElement) catatPelanggaran('Keluar dari Mode Layar Penuh'); });
      window.onbeforeunload = function() { if(isUjian) return "Data belum dikumpulkan! Yakin ingin keluar?"; };
    }

    function catatPelanggaran(jenis) {
      if (!isUjian) return; 
      if (Date.now() - lastBlur < 4000) return; 
      lastBlur = Date.now();
      
      pelanggaran++; document.getElementById('ui-pelanggaran').innerText = `${pelanggaran}/3`;
      saveToLocal(); 
      fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'catatPelanggaran', payload: { u: user.username, sesiId: sesi.id, jenis } }) });
      
      if (pelanggaran >= 3) { 
          isUjian = false;
          Swal.fire({ icon: 'error', title: 'UJIAN DIKUNCI', text: 'Toleransi pelanggaran habis (3x).', allowOutsideClick: false, confirmButtonText: 'Mengerti', confirmButtonColor: '#ef4444' })
          .then(() => eksekusiSubmit()); 
      } else { 
          Swal.fire({ icon: 'warning', title: `PERINGATAN ${pelanggaran}/3`, html: `Anda terdeteksi: <b>${jenis}</b>.<br><br>Pelanggaran 3x otomatis ujian dikunci!`, confirmButtonText: 'Kembali Ujian', confirmButtonColor: '#f59e0b', allowOutsideClick: false })
          .then(() => { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{}); }); 
      }
    }
  </script>
</body>
</html>
