<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CBT Siswa - SMKN 1 Klaten</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; margin: 0; user-select: none; -webkit-user-select: none; }
    .hidden { display: none !important; }
    .loader { border: 4px solid #f3f4f6; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen flex flex-col" oncontextmenu="return false;">

  <div id="loading-overlay" class="hidden fixed inset-0 z-50 bg-white/80 backdrop-blur-sm flex flex-col items-center justify-center">
    <div class="loader mb-3"></div><div class="text-sm font-bold text-slate-700">Memproses Data...</div>
  </div>

  <div id="view-login" class="flex-1 flex items-center justify-center p-5 bg-gradient-to-br from-slate-900 to-slate-800">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden">
      <div class="p-8 text-center bg-blue-600 relative overflow-hidden"><i data-lucide="smartphone" class="w-12 h-12 mx-auto mb-3 text-white"></i><h1 class="text-2xl font-bold text-white">CBT MOBILE</h1></div>
      <div class="p-8 space-y-5">
        <input id="login-username" type="text" placeholder="NIS / Username" class="w-full px-4 py-3 border-2 rounded-xl focus:border-blue-600 outline-none text-sm">
        <input id="login-password" type="password" placeholder="Password" onkeydown="if(event.key==='Enter') loginSiswa()" class="w-full px-4 py-3 border-2 rounded-xl focus:border-blue-600 outline-none text-sm">
        <button onclick="loginSiswa()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition">Masuk</button>
      </div>
    </div>
  </div>

  <div id="view-lobby" class="hidden flex-1 flex items-center justify-center p-5 bg-slate-50">
    <div class="bg-white rounded-3xl shadow-xl w-full max-w-sm p-8 space-y-6 text-center">
      <div><h2 class="text-xl font-bold text-slate-800" id="lobby-nama">Nama</h2><p class="text-sm font-semibold text-slate-500 bg-slate-100 inline-block px-3 py-1 rounded-full mt-2" id="lobby-kelas">Kelas</p></div>
      <div class="bg-red-50 border-l-4 border-red-500 p-4 text-left text-xs text-red-800 space-y-1.5"><strong class="block mb-1 text-sm">Anti-Cheat Aktif</strong><p>1. Wajib Layar Penuh.</p><p>2. Dilarang menutup aplikasi.</p></div>
      <input id="input-token" type="text" placeholder="KETIK TOKEN" class="w-full px-4 py-4 text-center text-lg font-mono font-bold uppercase tracking-[0.2em] border-2 rounded-xl focus:border-blue-600 outline-none">
      <button onclick="mulaiUjian()" class="w-full bg-slate-900 text-white font-bold py-3.5 rounded-xl">Mulai Ujian</button>
    </div>
  </div>

  <div id="view-ujian" class="hidden flex-1 flex flex-col h-screen overflow-hidden bg-slate-100">
    <header class="bg-white text-slate-800 px-4 py-3 flex justify-between items-center shrink-0 border-b shadow-sm z-10">
      <div class="font-bold text-xs truncate" id="header-mapel">Mapel</div>
      <div class="flex items-center gap-2">
        <div class="bg-red-100 px-2 py-1.5 rounded-lg text-[10px] font-bold text-red-600">Pelanggaran: <span id="ui-pelanggaran">0/3</span></div>
        <div class="bg-slate-900 px-3 py-1.5 rounded-lg font-mono font-bold text-emerald-400 text-sm"><span id="ui-waktu">00:00</span></div>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 pb-28 relative">
      <div class="bg-white rounded-2xl p-5 shadow-sm border">
        <div class="flex justify-between items-center mb-4 border-b pb-3"><span class="bg-blue-100 text-blue-800 font-bold px-3 py-1 rounded-lg text-xs" id="ui-nosoal">SOAL 1</span></div>
        <div id="ui-pertanyaan" class="text-slate-800 text-[15px] leading-relaxed font-medium mb-6"></div>
        <div id="ui-opsi" class="space-y-3"></div>
      </div>
    </main>

    <div class="absolute bottom-0 left-0 w-full bg-white border-t p-4 z-20">
      <div class="flex justify-between gap-3 max-w-lg mx-auto">
        <button onclick="navSoal(-1)" id="btn-prev" class="flex-1 py-3.5 bg-slate-100 rounded-xl text-sm font-bold text-slate-600">Kembali</button>
        <button onclick="navSoal(1)" id="btn-next" class="flex-1 py-3.5 bg-blue-600 rounded-xl text-sm font-bold text-white">Lanjut</button>
        <button onclick="kumpulUjian(false)" id="btn-finish" class="hidden flex-1 py-3.5 bg-emerald-500 rounded-xl text-sm font-bold text-white">Kumpulkan</button>
      </div>
    </div>
  </div>

  <script>
    // URL Anda
    const API_URL = "https://script.google.com/macros/s/AKfycbzFTfvZyEwK9kGtE14VeYgqXn2t6q6V5rput0NvIKryO5CqYCCS4PyEKcCM5qo9E-A/exec";
    
    let user = null, sesi = null, soalList = [], curIdx = 0, jawaban = {}, sisaDetik = 0, timer = null, pelanggaran = 0, isUjian = false, lastBlur = 0;

    lucide.createIcons();
    function showLoading() { document.getElementById('loading-overlay').classList.remove('hidden'); }
    function hideLoading() { document.getElementById('loading-overlay').classList.add('hidden'); }

    function callAPI(action, payload, callback) {
      showLoading();
      // Perbaikan Mutlak: Pisahkan identitas username agar tidak bentrok saat login awal
      let finalPayload = { ...payload };
      if (user && user.username && action !== 'login') {
        finalPayload.u = user.username;
      }
      
      fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, payload: finalPayload }) })
      .then(r => r.json()).then(res => { hideLoading(); callback(res); }).catch(() => { hideLoading(); Swal.fire('Error', 'Gagal koneksi server', 'error'); });
    }

    function loginSiswa() {
      // Penambahan .trim() untuk membuang spasi tak sengaja dari HP
      const u = document.getElementById('login-username').value.trim();
      const p = document.getElementById('login-password').value.trim();
      
      if (!u || !p) return Swal.fire('Perhatian', 'Harap isi NIS dan Password!', 'warning');
      
      callAPI('login', { u: u, p: p, role: 'Siswa' }, res => {
        if (!res.success) return Swal.fire('Gagal', res.msg, 'error');
        user = res.data;
        document.getElementById('view-login').classList.add('hidden');
        document.getElementById('view-lobby').classList.remove('hidden');
        document.getElementById('lobby-nama').innerText = user.nama;
        document.getElementById('lobby-kelas').innerText = user.kelas;
      });
    }

    function mulaiUjian() {
      const token = document.getElementById('input-token').value.trim();
      if (!token) return Swal.fire('Perhatian', 'Ketik token ujian!', 'warning');
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});

      callAPI('mulaiUjian', { token: token }, res => {
        if (!res.success) return Swal.fire('Gagal', res.msg, 'error');
        sesi = res.sesi; soalList = res.soal; curIdx = 0; jawaban = {}; pelanggaran = sesi.pelanggaran; sisaDetik = sesi.durasi * 60;
        document.getElementById('view-lobby').classList.add('hidden');
        document.getElementById('view-ujian').classList.remove('hidden');
        document.getElementById('header-mapel').innerText = sesi.mapel;
        renderSoal(); mulaiTimer(); pasangAntiCheat();
      });
    }

    function renderSoal() {
      const s = soalList[curIdx];
      document.getElementById('ui-nosoal').innerText = `SOAL ${curIdx + 1} / ${soalList.length}`;
      let htmlTanya = `<div class="mb-4">${s.tanya}</div>`;
      if (s.gbrSoal) s.gbrSoal.split(',').forEach(url => { htmlTanya += `<img src="${url.trim()}" class="w-full rounded-xl mb-4">`; });
      document.getElementById('ui-pertanyaan').innerHTML = htmlTanya;
      
      document.getElementById('ui-opsi').innerHTML = ['A','B','C','D','E'].map(opt => {
        if (!s['opsi'+opt] && !s['gbr'+opt]) return '';
        const isSel = jawaban[s.id] === opt;
        let htmlOpsi = s['opsi'+opt] ? `<div class="text-[15px]">${s['opsi'+opt]}</div>` : '';
        if (s['gbr'+opt]) { htmlOpsi += `<img src="${s['gbr'+opt].split(',')[0].trim()}" class="w-full max-w-[200px] mt-2">`; }
        return `<div onclick="pilihOpsi('${s.id}', '${opt}')" class="p-4 rounded-2xl border-2 transition-all flex items-start gap-4 ${isSel ? 'border-blue-500 bg-blue-50' : 'border-slate-200'}">
                  <div class="w-7 h-7 rounded-full flex items-center justify-center shrink-0 font-bold ${isSel ? 'bg-blue-600 text-white' : 'bg-slate-100'}">${opt}</div>
                  <div class="flex-1 mt-0.5">${htmlOpsi}</div></div>`;
      }).join('');

      document.getElementById('ui-pelanggaran').innerText = `${pelanggaran}/3`;
      document.getElementById('btn-prev').disabled = curIdx === 0;
      const isLast = (curIdx === soalList.length - 1);
      document.getElementById('btn-next').classList.toggle('hidden', isLast);
      document.getElementById('btn-finish').classList.toggle('hidden', !isLast);
    }

    function pilihOpsi(id, opt) { jawaban[id] = opt; renderSoal(); }
    function navSoal(step) { if(soalList[curIdx + step]) { curIdx += step; renderSoal(); window.scrollTo(0,0); } }

    function mulaiTimer() {
      isUjian = true;
      timer = setInterval(() => {
        sisaDetik--;
        document.getElementById('ui-waktu').innerText = `${Math.floor(sisaDetik / 60).toString().padStart(2,'0')}:${(sisaDetik % 60).toString().padStart(2,'0')}`;
        if(sisaDetik <= 0) { clearInterval(timer); kumpulUjian(true); }
      }, 1000);
    }

    function pasangAntiCheat() {
      document.addEventListener('visibilitychange', () => { if (isUjian && document.hidden) catatPelanggaran('Keluar aplikasi'); });
      document.addEventListener('fullscreenchange', () => { if (isUjian && !document.fullscreenElement) catatPelanggaran('Keluar layar penuh'); });
      window.onbeforeunload = function() { if(isUjian) return "Ujian sedang berlangsung!"; };
    }

    function catatPelanggaran(jenis) {
      if(Date.now() - lastBlur < 3000) return; lastBlur = Date.now();
      pelanggaran++; document.getElementById('ui-pelanggaran').innerText = `${pelanggaran}/3`;
      fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'catatPelanggaran', payload: { sesiId: sesi.id, jenis } }) });
      if (pelanggaran >= 3) { Swal.fire({ icon: 'error', title: 'UJIAN DIKUNCI', allowOutsideClick: false }).then(() => kumpulUjian(true)); } 
      else { Swal.fire({ icon: 'warning', title: `PERINGATAN ${pelanggaran}/3`, confirmButtonText: 'Lanjutkan' }).then(() => { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{}); }); }
    }

    function kumpulUjian(otomatis) {
      if (!otomatis && !confirm('Yakin kumpulkan?')) return;
      isUjian = false; clearInterval(timer); window.onbeforeunload = null;
      if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
      
      callAPI('kumpulUjian', { sesiId: sesi.id, jawaban }, res => {
        Swal.fire({ icon: 'success', title: 'UJIAN SELESAI', text: `Skor Anda: ${res.skor}`, allowOutsideClick: false }).then(() => location.reload());
      });
    }
  </script>
</body>
</html>
