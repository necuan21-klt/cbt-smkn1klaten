<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CBT Siswa - SMKN 1 Klaten</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; margin: 0; user-select: none; -webkit-user-select: none; }
    .hidden { display: none !important; }
    /* Loading Spinner */
    .loader { border: 4px solid #f3f4f6; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen flex flex-col" oncontextmenu="return false;">

  <!-- LOADING OVERLAY -->
  <div id="loading-overlay" class="hidden fixed inset-0 z-50 bg-white/80 backdrop-blur-sm flex flex-col items-center justify-center">
    <div class="loader mb-3"></div>
    <div class="text-sm font-bold text-slate-700">Memproses Data...</div>
  </div>

  <!-- LOGIN SISWA -->
  <div id="view-login" class="flex-1 flex items-center justify-center p-5 bg-gradient-to-br from-slate-900 to-slate-800">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden">
      <div class="p-8 text-center bg-blue-600 relative overflow-hidden">
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-500 rounded-full opacity-50"></div>
        <i data-lucide="smartphone" class="w-12 h-12 mx-auto mb-3 text-white relative z-10"></i>
        <h1 class="text-2xl font-bold text-white relative z-10 tracking-tight">CBT MOBILE</h1>
        <p class="text-xs text-blue-100 relative z-10 mt-1">SMK Negeri 1 Klaten</p>
      </div>
      <div class="p-8 space-y-5">
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-wide">Nomor Induk / Username</label>
          <div class="relative">
            <i data-lucide="user" class="w-5 h-5 absolute left-3 top-3 text-slate-400"></i>
            <input id="login-username" type="text" class="w-full pl-10 pr-4 py-3 border-2 border-slate-200 rounded-xl focus:border-blue-600 focus:ring-0 outline-none text-sm transition">
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-2 uppercase tracking-wide">Kata Sandi</label>
          <div class="relative">
            <i data-lucide="lock" class="w-5 h-5 absolute left-3 top-3 text-slate-400"></i>
            <input id="login-password" type="password" onkeydown="if(event.key==='Enter') loginSiswa()" class="w-full pl-10 pr-4 py-3 border-2 border-slate-200 rounded-xl focus:border-blue-600 focus:ring-0 outline-none text-sm transition">
          </div>
        </div>
        <button onclick="loginSiswa()" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2">
          Masuk <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- LOBBY & INPUT TOKEN -->
  <div id="view-lobby" class="hidden flex-1 flex items-center justify-center p-5 bg-slate-50">
    <div class="bg-white rounded-3xl shadow-xl w-full max-w-sm p-8 space-y-6 border border-slate-100 text-center">
      <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mx-auto shadow-inner">
        <i data-lucide="fingerprint" class="w-8 h-8"></i>
      </div>
      <div>
        <h2 class="text-xl font-bold text-slate-800" id="lobby-nama">Nama</h2>
        <p class="text-sm font-semibold text-slate-500 bg-slate-100 inline-block px-3 py-1 rounded-full mt-2" id="lobby-kelas">Kelas</p>
      </div>
      
      <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded-r-xl text-left text-xs text-red-800 space-y-1.5 shadow-sm">
        <strong class="block mb-1 text-sm flex items-center gap-1.5"><i data-lucide="shield-alert" class="w-4 h-4"></i> Anti-Cheat Aktif</strong>
        <p>1. Ujian berjalan di Layar Penuh.</p>
        <p>2. Dilarang menutup/pindah aplikasi.</p>
        <p>3. Dilarang <i>Swipe Back</i> (Kembali).</p>
      </div>
      
      <div class="pt-2">
        <input id="input-token" type="text" placeholder="KETIK TOKEN UJIAN" class="w-full px-4 py-4 text-center text-lg font-mono font-bold uppercase tracking-[0.2em] border-2 border-slate-300 rounded-xl focus:border-blue-600 outline-none transition bg-slate-50 focus:bg-white">
      </div>
      <button onclick="mulaiUjian()" class="w-full bg-slate-900 hover:bg-black active:scale-95 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2">
        Mulai Ujian <i data-lucide="play-circle" class="w-5 h-5"></i>
      </button>
    </div>
  </div>

  <!-- RUANG UJIAN (MOBILE OPTIMIZED) -->
  <div id="view-ujian" class="hidden flex-1 flex flex-col h-screen overflow-hidden bg-slate-100">
    <!-- Header Ringkas -->
    <header class="bg-white text-slate-800 px-4 py-3 flex justify-between items-center shrink-0 border-b shadow-sm z-10">
      <div class="flex items-center gap-2 max-w-[50%]">
        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white shrink-0 shadow-sm"><i data-lucide="book" class="w-4 h-4"></i></div>
        <div class="font-bold text-xs truncate leading-tight" id="header-mapel">Mapel</div>
      </div>
      <div class="flex items-center gap-2">
        <div class="bg-red-100 px-2 py-1.5 rounded-lg text-[10px] font-bold text-red-600 border border-red-200 flex items-center gap-1">
          <i data-lucide="alert-triangle" class="w-3 h-3"></i> <span id="ui-pelanggaran">0/3</span>
        </div>
        <div class="bg-slate-900 px-3 py-1.5 rounded-lg font-mono font-bold text-emerald-400 text-sm flex items-center gap-1.5 shadow-sm">
          <i data-lucide="clock" class="w-3.5 h-3.5 text-slate-400"></i> <span id="ui-waktu">00:00</span>
        </div>
      </div>
    </header>

    <!-- Area Konten (Scrollable) -->
    <main class="flex-1 overflow-y-auto p-4 pb-28 relative">
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-4 border-b pb-3">
          <span class="bg-blue-100 text-blue-800 font-bold px-3 py-1 rounded-lg text-xs" id="ui-nosoal">SOAL 1</span>
          <button onclick="bukaGrid()" class="text-xs font-bold text-slate-500 bg-slate-100 px-3 py-1 rounded-lg flex items-center gap-1 active:bg-slate-200">
            <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i> Lihat Semua
          </button>
        </div>
        
        <div id="ui-pertanyaan" class="text-slate-800 text-[15px] leading-relaxed whitespace-pre-wrap font-medium mb-6"></div>
        <div id="ui-opsi" class="space-y-3"></div>
      </div>
    </main>

    <!-- Floating Navigation Bar (Thumb-Zone) -->
    <div class="absolute bottom-0 left-0 w-full bg-white border-t border-slate-200 p-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-20">
      <div class="flex justify-between gap-3 max-w-lg mx-auto">
        <button onclick="navSoal(-1)" id="btn-prev" class="flex-1 py-3.5 bg-slate-100 rounded-xl text-sm font-bold text-slate-600 active:bg-slate-200 flex items-center justify-center gap-1 transition">
          <i data-lucide="chevron-left" class="w-5 h-5"></i> Kembali
        </button>
        <button onclick="navSoal(1)" id="btn-next" class="flex-1 py-3.5 bg-blue-600 rounded-xl text-sm font-bold text-white active:bg-blue-700 flex items-center justify-center gap-1 transition shadow-lg shadow-blue-600/30">
          Lanjut <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </button>
        <button onclick="kumpulUjian(false)" id="btn-finish" class="hidden flex-1 py-3.5 bg-emerald-500 rounded-xl text-sm font-bold text-white active:bg-emerald-600 flex items-center justify-center gap-1 transition shadow-lg shadow-emerald-500/30">
          Kumpulkan <i data-lucide="check-circle" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL GRID SOAL -->
  <div id="modal-grid" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex flex-col justify-end">
    <div class="bg-white w-full rounded-t-3xl p-6 pb-8 transform transition-transform shadow-2xl">
      <div class="flex justify-between items-center mb-5">
        <h3 class="font-bold text-slate-800">Navigasi Soal</h3>
        <button onclick="tutupGrid()" class="bg-slate-100 p-2 rounded-full active:bg-slate-200 text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div id="ui-grid" class="grid grid-cols-5 gap-3 max-h-[50vh] overflow-y-auto p-1"></div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzFTfvZyEwK9kGtE14VeYgqXn2t6q6V5rput0NvIKryO5CqYCCS4PyEKcCM5qo9E-A/exec";
    
    let user = null, sesi = null, soalList = [], curIdx = 0, jawaban = {}, sisaDetik = 0, timer = null;
    let pelanggaran = 0, isUjian = false, lastBlur = 0;

    lucide.createIcons();

    function showLoading() { document.getElementById('loading-overlay').classList.remove('hidden'); }
    function hideLoading() { document.getElementById('loading-overlay').classList.add('hidden'); }

    function callAPI(action, payload, callback) {
      showLoading();
      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action, payload: { ...payload, u: user?.username } })
      }).then(r => r.json()).then(res => { hideLoading(); callback(res); }).catch(() => { hideLoading(); Swal.fire('Error', 'Gagal koneksi ke server', 'error'); });
    }

    function loginSiswa() {
      const u = document.getElementById('login-username').value, p = document.getElementById('login-password').value;
      if (!u || !p) return Swal.fire({icon:'warning', title:'Perhatian', text:'Isi Username & Password', confirmButtonColor:'#3b82f6'});
      
      callAPI('loginSiswa', { u, p }, res => {
        if (!res.success) return Swal.fire({icon:'error', title:'Gagal Masuk', text:res.msg, confirmButtonColor:'#3b82f6'});
        user = res.data;
        document.getElementById('view-login').classList.add('hidden');
        document.getElementById('view-lobby').classList.remove('hidden');
        document.getElementById('lobby-nama').innerText = user.nama;
        document.getElementById('lobby-kelas').innerText = user.kelas;
      });
    }

    function mulaiUjian() {
      const token = document.getElementById('input-token').value;
      if (!token) return Swal.fire({icon:'warning', title:'Token Kosong', text:'Masukkan Token Ujian', confirmButtonColor:'#3b82f6'});
      
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});

      callAPI('mulaiUjian', { token }, res => {
        if (!res.success) return Swal.fire({icon:'error', title:'Gagal', text:res.msg, confirmButtonColor:'#3b82f6'});
        sesi = res.sesi; soalList = res.soal; curIdx = 0; jawaban = {}; pelanggaran = sesi.pelanggaran;
        sisaDetik = sesi.durasi * 60;
        
        document.getElementById('view-lobby').classList.add('hidden');
        document.getElementById('view-ujian').classList.remove('hidden');
        document.getElementById('header-mapel').innerText = sesi.mapel;
        
        renderSoal();
        mulaiTimer();
        pasangAntiCheat();
      });
    }

    function renderSoal() {
      const s = soalList[curIdx];
      document.getElementById('ui-nosoal').innerText = `SOAL ${curIdx + 1} / ${soalList.length}`;
      
      let htmlTanya = `<div class="mb-4">${s.tanya}</div>`;
      if (s.gbrSoal) {
        s.gbrSoal.split(',').forEach(url => { htmlTanya += `<img src="${url.trim()}" class="w-full rounded-xl border border-slate-200 shadow-sm mb-4">`; });
      }
      document.getElementById('ui-pertanyaan').innerHTML = htmlTanya;
      
      document.getElementById('ui-opsi').innerHTML = ['A','B','C','D','E'].map(opt => {
        if (!s['opsi'+opt] && !s['gbr'+opt]) return '';
        const isSel = jawaban[s.id] === opt;
        
        let htmlOpsi = s['opsi'+opt] ? `<div class="text-[15px] font-medium text-slate-700">${s['opsi'+opt]}</div>` : '';
        if (s['gbr'+opt]) { htmlOpsi += `<img src="${s['gbr'+opt].split(',')[0].trim()}" class="w-full max-w-[200px] rounded-lg border border-slate-200 mt-2">`; }

        return `<div onclick="pilihOpsi('${s.id}', '${opt}')" class="p-4 rounded-2xl border-2 cursor-pointer transition-all flex items-start gap-4 active:scale-[0.98] ${isSel ? 'border-blue-500 bg-blue-50/50 shadow-[0_0_0_4px_rgba(59,130,246,0.1)]' : 'border-slate-200 bg-white'}">
                  <div class="w-7 h-7 rounded-full flex items-center justify-center shrink-0 text-sm font-bold transition-colors ${isSel ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-500'}">${opt}</div>
                  <div class="flex-1 mt-0.5">${htmlOpsi}</div>
                </div>`;
      }).join('');

      document.getElementById('ui-pelanggaran').innerText = `${pelanggaran}/3`;
      document.getElementById('btn-prev').disabled = curIdx === 0;
      document.getElementById('btn-prev').classList.toggle('opacity-50', curIdx === 0);
      
      const isLast = (curIdx === soalList.length - 1);
      document.getElementById('btn-next').classList.toggle('hidden', isLast);
      document.getElementById('btn-finish').classList.toggle('hidden', !isLast);
    }

    function pilihOpsi(id, opt) { jawaban[id] = opt; renderSoal(); }
    function navSoal(step) { if(soalList[curIdx + step]) { curIdx += step; renderSoal(); window.scrollTo(0,0); } }
    
    function bukaGrid() {
      document.getElementById('modal-grid').classList.remove('hidden');
      document.getElementById('ui-grid').innerHTML = soalList.map((s, i) => {
        let bg = jawaban[s.id] ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' : 'bg-slate-100 text-slate-600 border border-slate-200';
        if (i === curIdx) bg = 'ring-2 ring-offset-2 ring-slate-800 ' + bg;
        return `<button onclick="tutupGrid(); curIdx=${i}; renderSoal();" class="aspect-square rounded-xl font-bold text-sm transition-all active:scale-95 ${bg}">${i+1}</button>`;
      }).join('');
    }
    function tutupGrid() { document.getElementById('modal-grid').classList.add('hidden'); }

    function mulaiTimer() {
      isUjian = true;
      timer = setInterval(() => {
        sisaDetik--;
        let m = Math.floor(sisaDetik / 60), s = sisaDetik % 60;
        document.getElementById('ui-waktu').innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        if(sisaDetik <= 0) { clearInterval(timer); kumpulUjian(true); }
      }, 1000);
    }

    function pasangAntiCheat() {
      // Deteksi Aplikasi Tertutup / Home Button ditekan
      document.addEventListener('visibilitychange', () => { if (isUjian && document.hidden) catatPelanggaran('Keluar dari aplikasi ujian'); });
      // Deteksi keluar layar penuh
      document.addEventListener('fullscreenchange', () => { if (isUjian && !document.fullscreenElement) catatPelanggaran('Keluar mode layar penuh'); });
      // Cegah tombol back browser / gesture usap balik
      window.onbeforeunload = function() { if(isUjian) return "Ujian sedang berlangsung!"; };
    }

    function catatPelanggaran(jenis) {
      if(Date.now() - lastBlur < 3000) return; lastBlur = Date.now();
      pelanggaran++; document.getElementById('ui-pelanggaran').innerText = `${pelanggaran}/3`;
      fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'catatPelanggaran', payload: { sesiId: sesi.id, jenis } }) });
      
      if (pelanggaran >= 3) {
        Swal.fire({ icon: 'error', title: 'UJIAN DIKUNCI', text: 'Toleransi pelanggaran habis.', confirmButtonColor:'#ef4444', allowOutsideClick: false }).then(() => kumpulUjian(true));
      } else {
        Swal.fire({ icon: 'warning', title: `PERINGATAN ${pelanggaran}/3`, text: jenis, confirmButtonColor:'#f59e0b', confirmButtonText: 'Lanjutkan Ujian' })
        .then(() => { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{}); });
      }
    }

    function kumpulUjian(otomatis) {
      if (!otomatis && !confirm('Yakin ingin menyelesaikan ujian?')) return;
      isUjian = false; clearInterval(timer); window.onbeforeunload = null;
      if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
      
      callAPI('kumpulUjian', { sesiId: sesi.id, jawaban }, res => {
        Swal.fire({ icon: 'success', title: 'UJIAN SELESAI', text: `Skor Anda: ${res.skor}`, confirmButtonColor: '#10b981', allowOutsideClick: false })
        .then(() => location.reload());
      });
    }
  </script>
</body>
</html>
